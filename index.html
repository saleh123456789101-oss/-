<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>سامانه هوشمند مدرسه</title>

<style>
:root{
    --primary:#2563eb;
    --primary2:#3b82f6;
    --dark:#172554;
    --sidebar:#172554;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#f59e0b;
    --purple:#7c3aed;
    --shadow:0 8px 25px rgba(15,23,42,.07);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
        radial-gradient(circle at top right,#60a5fa55,transparent 35%),
        radial-gradient(circle at bottom left,#8b5cf655,transparent 35%),
        linear-gradient(135deg,#eff6ff,#e0e7ff);
}

.login-box{
    width:430px;
    max-width:100%;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(15,23,42,.18);
}

.login-header{
    background:
        linear-gradient(135deg,#1d4ed8,#3b82f6);
    color:white;
    padding:35px 25px;
    text-align:center;
}

.school-logo{
    width:82px;
    height:82px;
    border-radius:24px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:#ffffff22;
    border:1px solid #ffffff55;
    backdrop-filter:blur(8px);
}

.login-header h1{
    margin:15px 0 5px;
    font-size:24px;
}

.login-header p{
    margin:0;
    opacity:.85;
}

.login-body{
    padding:28px;
}

.input-group{
    margin-bottom:17px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.input{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#f8fafc;
}

.input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px #2563eb18;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--primary);
    color:white;
    font-size:16px;
    font-weight:bold;
}

.login-error{
    color:var(--red);
    text-align:center;
    min-height:20px;
    font-size:13px;
}

/* ================= HEADER ================= */

.app{
    min-height:100vh;
}

.header{
    height:76px;
    background:linear-gradient(
        100deg,
        #1d4ed8,
        #2563eb,
        #3b82f6
    );
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 4px 18px #0f172a22;
}

.header-right{
    display:flex;
    align-items:center;
    gap:13px;
}

.header-avatar{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff22;
    border:1px solid #ffffff44;
    font-size:24px;
}

.header-name{
    font-weight:bold;
}

.header-sub{
    font-size:11px;
    opacity:.8;
    margin-top:3px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-button{
    border:0;
    background:#ffffff18;
    color:white;
    width:42px;
    height:42px;
    border-radius:12px;
    font-size:19px;
}

.icon-button:hover{
    background:#ffffff30;
}

/* ================= LAYOUT ================= */

.layout{
    display:flex;
    min-height:calc(100vh - 76px);
}

.sidebar{
    width:245px;
    background:var(--sidebar);
    color:white;
    flex-shrink:0;
    padding:13px 10px;
    transition:.25s;
}

.sidebar-title{
    padding:12px 15px;
    font-size:12px;
    color:#bfdbfe;
    font-weight:bold;
}

.nav-item{
    width:100%;
    border:0;
    background:transparent;
    color:#dbeafe;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:11px;
    text-align:right;
    font-size:14px;
    font-weight:bold;
}

.nav-item:hover{
    background:#ffffff12;
}

.nav-item.active{
    background:#2563eb;
    color:white;
    box-shadow:0 5px 15px #2563eb44;
}

.nav-icon{
    width:27px;
    text-align:center;
    font-size:17px;
}

.nav-badge{
    margin-right:auto;
    background:#ef4444;
    color:white;
    font-size:10px;
    border-radius:20px;
    padding:3px 7px;
}

.logout{
    margin-top:15px;
    background:#dc262622;
    color:#fecaca;
}

.main{
    flex:1;
    padding:20px;
    min-width:0;
}

.page{
    max-width:1450px;
    margin:auto;
}

/* ================= TITLE ================= */

.page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-title{
    margin:0;
    font-size:24px;
}

.page-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* ================= BUTTON ================= */

.btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    font-size:13px;
    background:var(--primary);
    color:white;
}

.btn:hover{
    filter:brightness(.95);
    transform:translateY(-1px);
}

.btn.green{
    background:var(--green);
}

.btn.red{
    background:var(--red);
}

.btn.orange{
    background:var(--orange);
}

.btn.gray{
    background:#64748b;
}

.btn.light{
    background:#e2e8f0;
    color:#1e293b;
}

/* ================= CARDS ================= */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    box-shadow:var(--shadow);
}

.card-title{
    margin:0 0 14px;
    font-size:16px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat{
    position:relative;
    overflow:hidden;
}

.stat-icon{
    width:47px;
    height:47px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    background:#dbeafe;
    color:#1d4ed8;
    margin-bottom:13px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.stat-blue .stat-icon{
    background:#dbeafe;
}

.stat-green .stat-icon{
    background:#dcfce7;
}

.stat-orange .stat-icon{
    background:#fef3c7;
}

.stat-purple .stat-icon{
    background:#ede9fe;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:12px;
}

.field{
    margin-bottom:11px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#f8fafc;
    outline:none;
}

select{
    height:43px;
}

.input:focus,
select:focus,
textarea:focus{
    border-color:var(--primary);
}

/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid var(--border);
    text-align:right;
    font-size:13px;
}

th{
    color:#475569;
    background:#f8fafc;
}

tr:hover td{
    background:#f8fafc;
}

/* ================= BADGE ================= */

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border-radius:30px;
    padding:5px 9px;
    font-size:11px;
    font-weight:bold;
}

.badge.green{
    background:#dcfce7;
    color:#166534;
}

.badge.red{
    background:#fee2e2;
    color:#991b1b;
}

.badge.blue{
    background:#dbeafe;
    color:#1e40af;
}

.badge.orange{
    background:#fef3c7;
    color:#92400e;
}

.badge.purple{
    background:#ede9fe;
    color:#5b21b6;
}

/* ================= WELCOME ================= */

.welcome{
    background:
        linear-gradient(120deg,#1d4ed8,#3b82f6);
    color:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}

.welcome:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:#ffffff12;
    left:-50px;
    top:-80px;
}

.welcome h2{
    margin:0 0 7px;
}

.welcome p{
    margin:0;
    opacity:.85;
}

/* ================= QUICK ================= */

.quick-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(145px,1fr));
    gap:12px;
}

.quick{
    border:1px solid var(--border);
    background:var(--card);
    border-radius:15px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.quick:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.quick-icon{
    font-size:28px;
    margin-bottom:8px;
}

.quick-title{
    font-size:13px;
    font-weight:bold;
}

/* ================= NOTICE ================= */

.notice{
    border-right:4px solid var(--primary);
    padding:13px;
    background:#f8fafc;
    border-radius:10px;
    margin-bottom:9px;
}

.notice-title{
    font-weight:bold;
    margin-bottom:5px;
}

.notice-text{
    color:var(--muted);
    font-size:12px;
    line-height:1.8;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 15px;
}

.empty-icon{
    font-size:40px;
    margin-bottom:8px;
}

/* ================= TIMETABLE ================= */

.timetable{
    display:grid;
    grid-template-columns:
        repeat(6,minmax(140px,1fr));
    gap:8px;
    overflow-x:auto;
}

.day-column{
    min-width:140px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:13px;
    padding:8px;
}

.day-title{
    text-align:center;
    font-weight:bold;
    color:#1e40af;
    padding:9px;
}

.lesson{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
}

.lesson-subject{
    font-weight:bold;
    font-size:13px;
}

.lesson-info{
    font-size:10px;
    color:var(--muted);
    margin-top:5px;
}

/* ================= CALENDAR ================= */

.calendar-grid{
    display:grid;
    grid-template-columns:
        repeat(7,1fr);
    gap:5px;
}

.calendar-day{
    min-height:80px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px;
}

.calendar-day.today{
    border:2px solid var(--primary);
}

.calendar-event{
    background:#dbeafe;
    color:#1e40af;
    padding:3px 5px;
    border-radius:5px;
    font-size:9px;
    margin-top:5px;
}

/* ================= PROGRESS ================= */

.progress{
    height:9px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(
        90deg,
        #2563eb,
        #60a5fa
    );
    border-radius:20px;
}

/* ================= PROFILE ================= */

.profile-head{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.big-avatar{
    width:76px;
    height:76px;
    border-radius:20px;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

/* ================= DARK MODE ================= */

body.dark{
    --bg:#0f172a;
    --card:#172033;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border:#293548;
    --sidebar:#020617;
}

body.dark .input,
body.dark select,
body.dark textarea,
body.dark th,
body.dark .day-column,
body.dark .lesson,
body.dark .notice,
body.dark .calendar-day,
body.dark .quick{
    background:#111827;
    color:#e5e7eb;
}

body.dark th{
    color:#cbd5e1;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .sidebar{
        width:72px;
    }

    .sidebar-title,
    .nav-text,
    .nav-badge{
        display:none;
    }

    .nav-item{
        justify-content:center;
        padding:13px 5px;
    }

    .nav-icon{
        width:auto;
        font-size:20px;
    }

    .main{
        padding:10px;
    }

}

@media(max-width:650px){

    .header{
        padding:0 10px;
    }

    .header-name{
        font-size:13px;
    }

    .header-sub{
        display:none;
    }

    .main{
        padding:8px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .page-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-title{
        font-size:20px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .stat{
        padding:13px;
    }

    .stat-number{
        font-size:22px;
    }

    .calendar-grid{
        grid-template-columns:
            repeat(7,80px);
        overflow-x:auto;
    }

}
</style>
</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="login-header">

            <div class="school-logo">
                🏫
            </div>

            <h1>
                سامانه هوشمند مدرسه
            </h1>

            <p>
                مدیریت آموزشی و دانش‌آموزی
            </p>

        </div>

        <div class="login-body">

            <div class="input-group">

                <label>
                    نام کاربری
                </label>

                <input
                    id="loginUser"
                    class="input"
                    autocomplete="username"
                    placeholder="نام کاربری"
                >

            </div>

            <div class="input-group">

                <label>
                    رمز عبور
                </label>

                <input
                    id="loginPass"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="رمز عبور"
                >

            </div>

            <button
                class="login-btn"
                onclick="login()"
            >
                ورود به سامانه
            </button>

            <div
                id="loginError"
                class="login-error"
            ></div>

        </div>

    </div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="app hidden">

    <header class="header">

        <div class="header-right">

            <div class="header-avatar">
                🏫
            </div>

            <div>

                <div
                    id="headerName"
                    class="header-name"
                >
                    سامانه مدرسه
                </div>

                <div
                    id="headerRole"
                    class="header-sub"
                >
                    سامانه آموزشی
                </div>

            </div>

        </div>


        <div class="header-left">

            <button
                class="icon-button"
                onclick="toggleDark()"
                title="حالت شب"
            >
                🌙
            </button>

            <button
                class="icon-button"
                onclick="home()"
            >
                🏠
            </button>

        </div>

    </header>


    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-title">
                منوی سامانه
            </div>

            <div id="nav"></div>

        </aside>


        <main class="main">

            <div
                id="page"
                class="page"
            ></div>

        </main>

    </div>

</div>


<script>

/* =====================================================
DATABASE
===================================================== */

const DB_KEY =
    "PRO_SCHOOL_SYSTEM_V3";


let db =
    JSON.parse(
        localStorage.getItem(DB_KEY)
        ||
        "null"
    );


if(!db){

    db = {

        managers:[
            {
                id:1,
                name:"محمدصالح",
                username:"محمدصالح",
                password:"00001"
            }
        ],

        students:[],

        homework:[],

        grades:[],

        attendance:[],

        schedule:[],

        notices:[],

        media:[],

        events:[],

        awards:[],

        subjects:[]

    };

    save();

}


let current = null;


/* =====================================================
HELPERS
===================================================== */

function save(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}


function id(){

    return Date.now() +
        Math.floor(
            Math.random()*9999
        );

}


function esc(v){

    return String(v ?? "")
        .replace(/[&<>"']/g,m=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m]));

}


function usernameExists(u){

    return (
        db.managers.some(x=>x.username===u)
        ||
        db.students.some(x=>x.username===u)
    );

}


function today(){

    return new Date()
        .toLocaleDateString(
            "fa-IR"
        );

}


/* =====================================================
LOGIN
===================================================== */

function login(){

    const u =
        document
        .getElementById("loginUser")
        .value
        .trim();

    const p =
        document
        .getElementById("loginPass")
        .value;

    const error =
        document
        .getElementById("loginError");


    let user =
        db.managers.find(
            x =>
            x.username===u &&
            x.password===p
        );


    if(user){

        current={
            ...user,
            type:"manager"
        };

        openApp();

        return;

    }


    user =
        db.students.find(
            x =>
            x.username===u &&
            x.password===p
        );


    if(user){

        current={
            ...user,
            type:"student"
        };

        openApp();

        return;

    }


    error.textContent =
        "نام کاربری یا رمز عبور صحیح نیست.";

}


document
.getElementById("loginPass")
.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            login();
        }
    }
);


/* =====================================================
OPEN
===================================================== */

function openApp(){

    document
    .getElementById("loginScreen")
    .classList
    .add("hidden");


    document
    .getElementById("app")
    .classList
    .remove("hidden");


    document
    .getElementById("headerName")
    .textContent =
        current.name;


    document
    .getElementById("headerRole")
    .textContent =
        current.type==="manager"
        ?
        "مدیریت سامانه مدرسه"
        :
        "پنل آموزشی دانش‌آموز";


    buildNav();

    home();

}


/* =====================================================
NAVIGATION
===================================================== */

function buildNav(){

    const nav =
        document.getElementById("nav");


    let common = `

        <button
            class="nav-item"
            id="n-home"
            onclick="home()"
        >
            <span class="nav-icon">🏠</span>
            <span class="nav-text">داشبورد</span>
        </button>

    `;


    if(current.type==="manager"){

        nav.innerHTML =
            common +

            `

            <button
                class="nav-item"
                id="n-users"
                onclick="users()"
            >
                <span class="nav-icon">👥</span>
                <span class="nav-text">کاربران</span>
            </button>


            <button
                class="nav-item"
                id="n-homework"
                onclick="homework()"
            >
                <span class="nav-icon">📝</span>
                <span class="nav-text">تکالیف</span>
            </button>


            <button
                class="nav-item"
                id="n-grades"
                onclick="grades()"
            >
                <span class="nav-icon">📊</span>

function addManager(){

    const name =
        document.getElementById("mName").value.trim();

    const username =
        document.getElementById("mUser").value.trim();

    const password =
        document.getElementById("mPass").value;


    if(!name||!username||!password)
        return alert("اطلاعات را کامل وارد کن.");


    if(usernameExists(username))
        return alert("این نام کاربری قبلاً استفاده شده.");


    db.managers.push({
        id:id(),
        name,
        username,
        password
    });


    save();

    alert("مدیر اضافه شد.");

    users();

}


function addStudent(){

    const name =
        document.getElementById("sName").value.trim();

    const cls =
        document.getElementById("sClass").value.trim();

    const username =
        document.getElementById("sUser").value.trim();

    const password =
        document.getElementById("sPass").value;


    if(!name||!username||!password)
        return alert("اطلاعات را کامل وارد کن.");


    if(usernameExists(username))
        return alert("این نام کاربری قبلاً استفاده شده.");


    db.students.push({
        id:id(),
        name,
        class:cls,
        username,
        password
    });


    save();

    alert("دانش‌آموز اضافه شد.");

    users();

}


function deleteUser(userId,role){

    if(!confirm("این حساب حذف شود؟"))
        return;


    if(role==="مدیر"){

        if(db.managers.length<=1)
            return alert(
                "حداقل یک مدیر باید باقی بماند."
            );


        db.managers =
            db.managers.filter(
                x=>x.id!==userId
            );

    }else{

        db.students =
            db.students.filter(
                x=>x.id!==userId
            );

        db.grades =
            db.grades.filter(
                x=>x.studentId!==userId
            );

        db.attendance =
            db.attendance.filter(
                x=>x.studentId!==userId
            );

    }


    save();

    users();

}

    save();

    schedule();

                    🏆 ثبت افتخار
                </h3>


                <div class="form-grid">


                    <div class="field">

                        <label>
                            دانش‌آموز
                        </label>

                        <select id="awardStudent">

                            ${
                                db.students.map(
                                    s=>`

                                    <option value="${s.id}">
                                        ${esc(s.name)}
                                    </option>

                                    `
                                ).join("")
                            }

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            عنوان
                        </label>

                        <input
                            id="awardTitle"
                            class="input"
                            placeholder="مثلاً رتبه اول مسابقات"
                        >

                    </div>


                    <div class="field full">

                        <label>
                            توضیحات
                        </label>

                        <textarea
                            id="awardDesc"
                        ></textarea>

                    </div>

                </div>


                <button
                    class="btn orange"
                    onclick="addAward()"
                >
                    ثبت افتخار 🏆
                </button>

            </div>

            <br>

            `
            :
            ""
        }


        <div class="grid">


            ${
                list.length

                ?

                list
                .slice()
                .reverse()
                .map(
                    a=>{

                        const s =
                            db.students.find(
                                x=>x.id===a.studentId
                            );

                        return `

                        <div class="card">

                            <div
                                style="
                                font-size:40px;
                                "
                            >
                                🏆
                            </div>

                            <h3>
                                ${esc(a.title)}
                            </h3>

                            ${
                                current.type==="manager"
                                ?
                                `
                                <span class="badge purple">
                                    ${esc(s?.name||"—")}
                                </span>
                                `
                                :
                                ""
                            }

                            <p>
                                ${esc(a.description||"")}
                            </p>


                            ${
                                current.type==="manager"
                                ?
                                `
                                <button
                                    class="btn red"
                                    onclick="remove('awards',${a.id},awards)"
                                >
                                    حذف
                                </button>
                                `
                                :
                                ""
                            }

                        </div>

                        `;

                    }
                ).join("")

                :

                `
                <div class="card empty">
                    <div class="empty-icon">
                        🏆
                    </div>
                    هنوز افتخاری ثبت نشده است.
                </div>
                `

            }

        </div>

        `,

        "awards"

    );

}


function addAward(){

    const studentId =
        Number(
            document.getElementById("awardStudent").value
        );

    const title =
        document.getElementById("awardTitle").value.trim();

    const description =
        document.getElementById("awardDesc").value.trim();


    if(!studentId||!title)
        return alert("اطلاعات را کامل کن.");


    db.awards.push({
        id:id(),
        studentId,
        title,
        description
    });


    save();

    awards();

}


/* =====================================================
SUBJECTS
===================================================== */

function subjects(){

    render(

        "دروس",

        "مدیریت فهرست درس‌های مدرسه",

        `

        ${
            current.type==="manager"
            ?
            `

            <div class="card">

                <h3 class="card-title">
                    📚 افزودن درس
                </h3>


                <div class="form-grid">


                    <div class="field">

                        <label>
                            نام درس
                        </label>

                        <input
                            id="subjectName"
                            class="input"
                        >

                    </div>


                    <div class="field">

                        <label>
                            معلم
                        </label>

                        <input
                            id="subjectTeacher"
                            class="input"
                        >

                    </div>


                    <div class="field">

                        <label>
                            کلاس
                        </label>

                        <input
                            id="subjectClass"
                            class="input"
                        >

                    </div>

                <button

            </div>

            `

        }


        <div class="grid">


            ${
                db.subjects.length

                ?

                db.subjects.map(
                    s=>`

                    <div class="card">

                        <div
                            style="
                            font-size:30px;
                            margin-bottom:10px
                            "
                        >
                            📚
                        </div>

                        <h3>
                            ${esc(s.name)}
                        </h3>

                        <p>
                            👨‍🏫
                            ${esc(s.teacher||"—")}
                        </p>

                        <p>
                            🏫
                            ${esc(s.class||"—")}
                        </p>


                        ${
                            current.type==="manager"
                            ?
                            `
                            <button
                                class="btn red"
                                onclick="remove('subjects',${s.id},subjects)"
                            >
                                حذف
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    `
                ).join("")

                :

                `
                <div class="card empty">
                    <div class="empty-icon">
                        📚
                    </div>
                    هنوز درسی ثبت نشده است.
                </div>
                `

            }

        </div>

        `,

        "subjects"

    );

}


function addSubject(){

    const name =
        document.getElementById("subjectName").value.trim();

    const teacher =
        document.getElementById("subjectTeacher").value.trim();

    const cls =
        document.getElementById("subjectClass").value.trim();


    if(!name)
        return alert("نام درس را وارد کن.");


    db.subjects.push({
        id:id(),
        name,
        teacher,
        class:cls
    });


    save();

    subjects();

}

/* =====================================================
REMOVE
===================================================== */

function remove(collection,itemId,callback){

    if(!confirm("این مورد حذف شود؟"))
        return;


    db[collection] =
        db[collection].filter(
            x=>x.id!==itemId
        );


    save();

    callback();

}


/* =====================================================
DARK MODE
===================================================== */

function toggleDark(){

    document
    .body
    .classList
    .toggle("dark");


    localStorage.setItem(
        "school_dark",
        document.body.classList.contains("dark")
        ?
        "1"
        :
        "0"
    );

}


if(
    localStorage.getItem("school_dark")==="1"
){

    document.body.classList.add("dark");

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

    current=null;


    document
    .getElementById("app")
    .classList
    .add("hidden");


    document
    .getElementById("loginScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("loginUser")
    .value="";


    document
    .getElementById("loginPass")
    .value="";


    document
    .getElementById("loginError")
    .textContent="";

}
